# GitHub — default dark + light
name = "GitHub"
syntax       = "github-dark"
syntax_light = "github"

[dark]
background = "#0d1117"
panel      = "#161b22"
element    = "#21262d"
hover      = "#1c2129"
text       = "#e6edf3"
text_muted = "#7d8590"
purple     = "#bc8cff"
blue       = "#58a6ff"
green      = "#3fb950"
red        = "#f85149"
yellow     = "#e3b341"
cyan       = "#39c5cf"
orange     = "#d29922"
pink       = "#f778ba"

[light]
background = "#ffffff"
panel      = "#f6f8fa"
element    = "#ddf4ff"
hover      = "#eaeef2"
text       = "#1f2328"
text_muted = "#59636e"
purple     = "#8250df"
blue       = "#0969da"
green      = "#1a7f37"
red        = "#d1242f"
yellow     = "#bf8700"
cyan       = "#0550ae"
orange     = "#bc4c00"
pink       = "#bf3989"
