# Catppuccin — https://catppuccin.com (Mocha for dark, Latte for light)
name = "Catppuccin"
syntax       = "catppuccin-mocha"
syntax_light = "catppuccin-latte"

[dark]
background = "#1e1e2e"
panel      = "#181825"
element    = "#313244"
hover      = "#292937"
text       = "#cdd6f4"
text_muted = "#6c7086"
purple     = "#cba6f7"
blue       = "#89b4fa"
green      = "#a6e3a1"
red        = "#f38ba8"
yellow     = "#f9e2af"
cyan       = "#89dceb"
orange     = "#fab387"
pink       = "#f5c2e7"
teal       = "#94e2d5"

[light]
background = "#eff1f5"
panel      = "#e6e9ef"
element    = "#ccd0da"
hover      = "#dce0e8"
text       = "#4c4f69"
text_muted = "#9ca0b0"
purple     = "#8839ef"
blue       = "#1e66f5"
green      = "#40a02b"
red        = "#d20f39"
yellow     = "#df8e1d"
cyan       = "#04a5e5"
orange     = "#fe640b"
pink       = "#ea76cb"
teal       = "#179299"
